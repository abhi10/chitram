# Development override for docker-compose.yml
# This starts the FastAPI app automatically instead of sleep infinity

services:
  app:
    command: >
      sh -c "
        cd /workspaces/image-hosting-app/backend &&
        uv sync &&
        uv run alembic upgrade head &&
        uv run uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
      "
    environment:
      # Override for local development (no Supabase needed)
      - AUTH_PROVIDER=local
